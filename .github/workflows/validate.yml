name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  research-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project metadata and README index
        run: python scripts/research_hub.py check

      - name: Run infrastructure tests
        run: python -m unittest discover -s tests -v

      - name: Build static portal
        run: python scripts/research_hub.py build --output .tmp/research-site

      - name: Verify portal entry
        run: test -s .tmp/research-site/index.html
